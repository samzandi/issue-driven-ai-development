name: CI

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "SKILL.md"
      - "LICENSE"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
      - "MAINTAINERS.md"
      - "CHANGELOG.md"
      - "agents/**"
      - "references/**"
      - "docs/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "README.md"
      - "SKILL.md"
      - "LICENSE"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
      - "MAINTAINERS.md"
      - "CHANGELOG.md"
      - "agents/**"
      - "references/**"
      - "docs/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate repository
        run: python tools/validate_skill.py

      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py'
