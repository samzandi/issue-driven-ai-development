name: Feature request
description: Propose a focused improvement to planning, execution, verification, or GitHub mapping.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification plan
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Security, privacy, and compatibility risks
